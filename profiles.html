<main class="profiles-page">

    <section class="profiles-header">
        <h1>Profiles</h1>
        <p>Search for BlockTiers players and view their public profiles.</p>
    </section>

    <form class="profile-search-box" id="profile-search-form">
        <input
            type="text"
            id="profile-search-input"
            class="profile-search-input"
            placeholder="Search for a username..."
            autocomplete="off"
            maxlength="30"
        >

        <button
            type="submit"
            id="profile-search-button"
            class="profile-search-button"
        >
            Search
        </button>
    </form>

    <div id="profiles-status" class="profiles-status">
        Search for a player to get started.
    </div>

    <section id="profile-results" class="profile-results"></section>

</main>

<script src="js/supabase-config.js"></script>

<script>
    let supabaseClient = null;

    const searchForm = document.getElementById("profile-search-form");
    const searchInput = document.getElementById("profile-search-input");
    const searchButton = document.getElementById("profile-search-button");
    const statusElement = document.getElementById("profiles-status");
    const resultsElement = document.getElementById("profile-results");

    async function waitForSupabaseClient() {
        for (let i = 0; i < 50; i++) {
            if (window.supabaseClient) {
                return window.supabaseClient;
            }

            if (window.blockTiersSupabase) {
                return window.blockTiersSupabase;
            }

            if (window.blockTiersAuth && window.blockTiersAuth.supabase) {
                return window.blockTiersAuth.supabase;
            }

            await new Promise(resolve => setTimeout(resolve, 100));
        }

        return null;
    }

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value ?? "";
        return div.innerHTML;
    }

    function getAvatar(profile) {
        if (profile.avatar_url && profile.avatar_url.trim() !== "") {
            return profile.avatar_url;
        }

        return "https://ui-avatars.com/api/?name=" +
            encodeURIComponent(profile.display_name || profile.username || "User") +
            "&background=191c2a&color=ffffff&size=128";
    }

    function showEmpty(title, message) {
        resultsElement.innerHTML = `
            <div class="empty-state">
                <h2>${escapeHtml(title)}</h2>
                <p>${escapeHtml(message)}</p>
            </div>
        `;
    }

    function displayResults(profiles) {
        if (!profiles || profiles.length === 0) {
            showEmpty(
                "No profiles found",
                "Try searching for a different username."
            );
            return;
        }

        resultsElement.innerHTML = profiles.map(profile => {
            const username = profile.username || "Unknown";
            const displayName = profile.display_name || username;

            return `
                <article class="profile-card">
                    <img
                        class="profile-avatar"
                        src="${escapeHtml(getAvatar(profile))}"
                        alt="${escapeHtml(displayName)}"
                        onerror="this.src='https://ui-avatars.com/api/?name=User&background=191c2a&color=ffffff&size=128';"
                    >

                    <div class="profile-card-info">
                        <h2 class="profile-display-name">
                            ${escapeHtml(displayName)}
                        </h2>

                        <p class="profile-username">
                            @${escapeHtml(username)}
                        </p>
                    </div>

                    <a
                        class="profile-view-button"
                        href="public-profile.html?username=${encodeURIComponent(username)}"
                    >
                        View
                    </a>
                </article>
            `;
        }).join("");
    }

    async function searchProfiles(username) {
        if (!supabaseClient) {
            statusElement.textContent = "Supabase is still loading. Please try again.";
            return;
        }

        const searchTerm = username.trim();

        if (!searchTerm) {
            statusElement.textContent = "Enter a username to search.";
            resultsElement.innerHTML = "";
            return;
        }

        searchButton.disabled = true;
        searchButton.textContent = "Searching...";
        statusElement.textContent = "Searching...";
        resultsElement.innerHTML = "";

        try {
            const { data, error } = await supabaseClient
                .from("profiles")
                .select("username, display_name, avatar_url")
                .ilike("username", `%${searchTerm}%`)
                .limit(20);

            if (error) {
                console.error("Profile search error:", error);
                statusElement.textContent = "Unable to search profiles.";
                showEmpty(
                    "Search error",
                    "Something went wrong while searching. Check the browser console for details."
                );
                return;
            }

            statusElement.textContent =
                data.length === 1
                    ? "1 profile found."
                    : `${data.length} profiles found.`;

            displayResults(data);

        } catch (error) {
            console.error("Profile search error:", error);

            statusElement.textContent = "Unable to search profiles.";

            showEmpty(
                "Something went wrong",
                "Please try again."
            );
        } finally {
            searchButton.disabled = false;
            searchButton.textContent = "Search";
        }
    }

    searchForm.addEventListener("submit", function(event) {
        event.preventDefault();
        searchProfiles(searchInput.value);
    });

    searchInput.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            searchInput.value = "";
            resultsElement.innerHTML = "";
            statusElement.textContent = "Search for a player to get started.";
            searchInput.focus();
        }
    });

    async function initializeProfilesPage() {
        supabaseClient = await waitForSupabaseClient();

        if (!supabaseClient) {
            console.error("Supabase client could not be found.");
            statusElement.textContent = "Unable to connect to BlockTiers.";
            return;
        }

        console.log("BlockTiers profile search ready.");
    }

    initializeProfilesPage();
</script>
