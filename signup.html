<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - BlockTiers</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body>
<header class="navbar">
<a href="index.html" class="logo">Block<span>Tiers</span></a>
<nav>
<a href="index.html">Home</a><a href="mace.html">Mace</a><a href="sword.html">Sword</a><a href="crystal.html">Crystal</a><a href="axe.html">Axe</a><a href="uhc.html">UHC</a><a href="smp.html">SMP</a><a href="rules.html">Rules</a><a href="whats-new.html">What's New</a>
<span id="account-slot"><a href="login.html" class="account-button">Login</a></span>
</nav>
</header>
<main class="auth-page">
<section class="auth-card">
<h1>Create Account</h1><p class="auth-subtitle">Join BlockTiers and create your player profile.</p>
<form id="signup-form">
<div class="form-group"><label for="display-name">Display Name</label><input id="display-name" type="text" maxlength="32" placeholder="Reda" required></div>
<div class="form-group"><label for="username">Username</label><input id="username" type="text" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" placeholder="RedaPlays" autocomplete="username" required></div>
<div class="form-group"><label for="password">Password</label><input id="password" type="password" minlength="8" placeholder="Your password" autocomplete="new-password" required></div>
<div class="form-group"><label for="confirm-password">Confirm Password</label><input id="confirm-password" type="password" minlength="8" placeholder="Repeat your password" autocomplete="new-password" required></div>
<p id="signup-message" class="form-message"></p>
<button class="auth-submit" type="submit">Create Account</button>
</form>
<p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
</section>
</main>
<footer>BlockTiers &copy; 2026</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script><script src="js/auth.js"></script>
</body></html>
