<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - BlockTiers</title>

    <link rel="icon" type="image/png" href="images/BlockTiersicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

    <style>
        .recovery-page {
            max-width: 520px;
            margin: 0 auto;
            padding: 70px 20px 100px;
        }

        .recovery-card {
            padding: 30px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
        }

        .recovery-card h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .recovery-card p {
            line-height: 1.6;
            opacity: 0.65;
        }

        .recovery-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        .recovery-form label {
            font-size: 14px;
            font-weight: 600;
        }

        .recovery-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.25);
            color: #fff;
            outline: none;
            font-family: inherit;
        }

        .recovery-form input:focus {
            border-color: rgba(255,255,255,0.3);
        }

        .recovery-form button {
            padding: 11px 16px;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 9px;
            background: rgba(255,255,255,0.08);
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        .recovery-form button:hover {
            background: rgba(255,255,255,0.12);
        }

        .recovery-message {
            min-height: 20px;
            margin-top: 14px;
            font-size: 13px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: inherit;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<header class="navbar">
    <div style="display:flex;align-items:center;gap:12px;">
        <a href="index.html" class="logo">
            <img
                src="images/BlockTiersicon.png"
                alt="BlockTiers"
                style="width:34px;height:34px;object-fit:contain;border-radius:8px;"
            >
            Block<span>Tiers</span>
        </a>
    </div>
</header>

<main class="recovery-page">

    <section class="recovery-card">

        <h1>Forgot your password?</h1>

        <p>
            Enter your BlockTiers username. If your account has a verified recovery email,
            we will send a password reset link to it.
        </p>

        <form id="forgot-password-form" class="recovery-form">

            <label for="recovery-username">
                Username
            </label>

            <input
                type="text"
                id="recovery-username"
                maxlength="20"
                autocomplete="username"
                required
            >

            <button type="submit" id="recovery-button">
                Send Reset Link
            </button>

        </form>

        <p id="recovery-message" class="recovery-message"></p>

        <a href="login.html" class="back-link">
            Back to Login
        </a>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>

<script>
    const client = window.supabase.createClient(
        window.BLOCKTIERS_SUPABASE_URL,
        window.BLOCKTIERS_SUPABASE_ANON_KEY
    );

    const form =
        document.getElementById("forgot-password-form");

    const button =
        document.getElementById("recovery-button");

    const message =
        document.getElementById("recovery-message");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const username =
            document.getElementById("recovery-username")
                .value
                .trim();

        button.disabled = true;
        button.textContent = "Sending...";
        message.textContent = "";

        try {
            const { data, error } =
                await client.functions.invoke(
                    "account-auth",
                    {
                        body: {
                            action: "forgot-password",
                            username
                        }
                    }
                );

            if (error) {
                throw error;
            }

            message.textContent =
                data?.message ||
                "If this account has a verified recovery email, a password reset link has been sent.";

        } catch (error) {
            console.error(
                "BlockTiers password reset request failed:",
                error
            );

            message.textContent =
                "We could not process the request right now. Please try again.";
        }

        button.disabled = false;
        button.textContent = "Send Reset Link";
    });
</script>

</body>
</html>
