</style>

</main>

<script src="js/supabase-config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const menuButton = document.getElementById("menu-button");
    const sidebar = document.getElementById("sidebar");
    const sidebarClose = document.getElementById("sidebar-close");
    const sidebarOverlay = document.getElementById("sidebar-overlay");

    function openSidebar() {
        sidebar.classList.add("open");
        sidebarOverlay.classList.add("show");
        document.body.classList.add("sidebar-open");
    }

    function closeSidebar() {
        sidebar.classList.remove("open");
        sidebarOverlay.classList.remove("show");
        document.body.classList.remove("sidebar-open");
    }

    menuButton.addEventListener("click", openSidebar);
    sidebarClose.addEventListener("click", closeSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            closeSidebar();
        }
    });

    sidebar.querySelectorAll("a").forEach(function(link) {
        link.addEventListener("click", function() {
            closeSidebar();
        });
    });


    const supabaseClient = window.supabase.createClient(
        window.BLOCKTIERS_SUPABASE_URL,
        window.BLOCKTIERS_SUPABASE_ANON_KEY
    );


    const params = new URLSearchParams(window.location.search);
    const username = params.get("username");

    const loading = document.getElementById("profileLoading");
    const error = document.getElementById("profileError");
    const errorMessage = document.getElementById("errorMessage");
    const container = document.getElementById("profileContainer");

    const avatar = document.getElementById("profileAvatar");
    const displayName = document.getElementById("profileDisplayName");
    const usernameElement = document.getElementById("profileUsername");
    const socialContent = document.getElementById("socialContent");
    const friendArea = document.getElementById("friendArea");


    let currentUser = null;
    let profileUser = null;


    function showError(message) {
        loading.style.display = "none";
        container.style.display = "none";
        error.style.display = "block";
        errorMessage.textContent = message;
    }


    async function loadCurrentUser() {

        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();

        currentUser = user || null;
    }


    function setFriendButton(text, className, disabled, clickHandler) {

        friendArea.innerHTML = "";

        const button = document.createElement("button");

        button.type = "button";
        button.className = "friend-button " + (className || "");
        button.textContent = text;
        button.disabled = !!disabled;

        if (clickHandler) {
            button.addEventListener("click", clickHandler);
        }

        friendArea.appendChild(button);
    }


    async function loadFriendStatus() {

        if (!currentUser || !profileUser) {
            friendArea.style.display = "none";
            return;
        }


        if (currentUser.id === profileUser.id) {
            friendArea.style.display = "none";
            return;
        }


        friendArea.style.display = "block";
        friendArea.innerHTML = "";


        const [
            outgoingResult,
            incomingResult,
            friendshipResult
        ] = await Promise.all([

            supabaseClient
                .from("friend_requests")
                .select("id, status, sender_id, receiver_id")
                .eq("sender_id", currentUser.id)
                .eq("receiver_id", profileUser.id)
                .maybeSingle(),

            supabaseClient
                .from("friend_requests")
                .select("id, status, sender_id, receiver_id")
                .eq("sender_id", profileUser.id)
                .eq("receiver_id", currentUser.id)
                .maybeSingle(),

            supabaseClient
                .from("friendships")
                .select("id, user_id, friend_id")
                .or(
                    "and(user_id.eq." +
                    currentUser.id +
                    ",friend_id.eq." +
                    profileUser.id +
                    "),and(user_id.eq." +
                    profileUser.id +
                    ",friend_id.eq." +
                    currentUser.id +
                    ")"
                )
        ]);


        if (outgoingResult.error) {
            console.error(outgoingResult.error);
        }

        if (incomingResult.error) {
            console.error(incomingResult.error);
        }

        if (friendshipResult.error) {
            console.error(friendshipResult.error);
        }


        const outgoing = outgoingResult.data;
        const incoming = incomingResult.data;
        const friendships = friendshipResult.data || [];


        if (friendships.length > 0) {

            setFriendButton(
                "Friends",
                "success",
                true,
                null
            );

            return;
        }


        if (incoming && incoming.status === "pending") {

            friendArea.innerHTML = `
                <div class="friend-actions">
                    <button
                        type="button"
                        class="friend-button"
                        id="acceptFriendButton"
                    >
                        Accept
                    </button>

                    <button
                        type="button"
                        class="friend-button danger"
                        id="declineFriendButton"
                    >
                        Decline
                    </button>
                </div>
            `;

            document
                .getElementById("acceptFriendButton")
                .addEventListener("click", function() {
                    acceptFriendRequest(incoming.id);
                });

            document
                .getElementById("declineFriendButton")
                .addEventListener("click", function() {
                    declineFriendRequest(incoming.id);
                });

            return;
        }


        if (outgoing && outgoing.status === "pending") {

            setFriendButton(
                "Request Sent",
                "secondary",
                false,
                function() {
                    cancelFriendRequest(outgoing.id);
                }
            );

            return;
        }


        setFriendButton(
            "Add Friend",
            "",
            false,
            sendFriendRequest
        );
    }


    async function sendFriendRequest() {

        if (!currentUser || !profileUser) {
            return;
        }


        setFriendButton(
            "Sending...",
            "secondary",
            true,
            null
        );


        const { error: insertError } = await supabaseClient
            .from("friend_requests")
            .insert({
                sender_id: currentUser.id,
                receiver_id: profileUser.id,
                status: "pending"
            });


        if (insertError) {

            console.error(insertError);

            alert("Unable to send friend request.");

            await loadFriendStatus();

            return;
        }


        await loadFriendStatus();
    }


    async function cancelFriendRequest(requestId) {

        const { error: deleteError } = await supabaseClient
            .from("friend_requests")
            .delete()
            .eq("id", requestId);


        if (deleteError) {

            console.error(deleteError);

            alert("Unable to cancel friend request.");

            return;
        }


        await loadFriendStatus();
    }


    async function declineFriendRequest(requestId) {

        const { error: updateError } = await supabaseClient
            .from("friend_requests")
            .update({
                status: "declined",
                updated_at: new Date().toISOString()
            })
            .eq("id", requestId);


        if (updateError) {

            console.error(updateError);

            alert("Unable to decline friend request.");

            return;
        }


        await loadFriendStatus();
    }


    async function acceptFriendRequest(requestId) {

        if (!currentUser || !profileUser) {
            return;
        }


        const { error: updateError } = await supabaseClient
            .from("friend_requests")
            .update({
                status: "accepted",
                updated_at: new Date().toISOString()
            })
            .eq("id", requestId);


        if (updateError) {

            console.error(updateError);

            alert("Unable to accept friend request.");

            return;
        }


        const firstUser =
            currentUser.id < profileUser.id
                ? currentUser.id
                : profileUser.id;

        const secondUser =
            currentUser.id < profileUser.id
                ? profileUser.id
                : currentUser.id;


        const { error: friendshipError } = await supabaseClient
            .from("friendships")
            .insert([
                {
                    user_id: firstUser,
                    friend_id: secondUser
                },
                {
                    user_id: secondUser,
                    friend_id: firstUser
                }
            ]);


        if (friendshipError) {

            console.error(friendshipError);

            alert(
                "The request was accepted, but the friendship could not be created."
            );

            return;
        }


        await loadFriendStatus();
    }


    async function loadProfile() {

        if (!username) {
            showError("No username was provided.");
            return;
        }


        await loadCurrentUser();


        const { data, error: supabaseError } = await supabaseClient
            .from("profiles")
            .select(
                "id, username, display_name, avatar_url, discord_username, youtube_url"
            )
            .eq("username", username)
            .maybeSingle();


        if (supabaseError) {
            console.error(supabaseError);
            showError("Unable to connect to BlockTiers.");
            return;
        }


        if (!data) {
            showError("This profile does not exist.");
            return;
        }


        profileUser = data;


        displayName.textContent =
            data.display_name ||
            data.username ||
            "BlockTiers User";


        usernameElement.textContent =
            "@" + data.username;


        if (data.avatar_url) {

            avatar.src = data.avatar_url;

        } else {

            avatar.src =
                "https://ui-avatars.com/api/?name=" +
                encodeURIComponent(
                    data.display_name || data.username
                ) +
                "&background=7c5cff&color=ffffff";

        }


        socialContent.innerHTML = "";

        let hasSocial = false;


        if (data.discord_username) {

            hasSocial = true;

            const discordCard = document.createElement("div");
            discordCard.className = "social-card";

            discordCard.innerHTML = `
                <div class="social-icon">DC</div>

                <div class="social-details">
                    <p class="social-name">Discord</p>

                    <p class="social-description">
                        ${escapeHtml(data.discord_username)}
                    </p>
                </div>
            `;

            socialContent.appendChild(discordCard);
        }


        if (
            data.youtube_url &&
            (
                data.youtube_url.startsWith("https://youtube.com/") ||
                data.youtube_url.startsWith("https://www.youtube.com/")
            )
        ) {

            hasSocial = true;

            const youtubeCard = document.createElement("div");
            youtubeCard.className = "social-card";

            youtubeCard.innerHTML = `
                <div class="social-icon">YT</div>

                <div class="social-details">
                    <p class="social-name">YouTube</p>

                    <p class="social-description">
                        ${escapeHtml(data.youtube_url)}
                    </p>
                </div>

                <a
                    class="social-button"
                    href="${escapeAttribute(data.youtube_url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Open
                </a>
            `;

            socialContent.appendChild(youtubeCard);
        }


        if (!hasSocial) {

            socialContent.innerHTML = `
                <div class="no-socials">
                    This user hasn't added any social media yet.
                </div>
            `;

        }


        loading.style.display = "none";
        container.style.display = "block";


        await loadFriendStatus();
    }


    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function escapeAttribute(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }


    loadProfile();
</script>
