<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - BlockTiers</title>

    <link rel="icon" type="image/png" href="images/BlockTiersicon.png">
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        .sidebar-logo img {
            width: 32px !important;
            height: 32px !important;
            max-width: 32px !important;
            max-height: 32px !important;
            object-fit: contain !important;
            flex-shrink: 0 !important;
        }

        .profile-page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .profile-card {
            background: rgba(15, 18, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
        }

        .profile-banner {
            height: 180px;
            background: linear-gradient(135deg, #171b2d, #0b0d16);
        }

        .profile-content {
            padding: 32px;
            text-align: center;
        }

        .profile-name {
            margin: 0 0 4px;
            font-size: 30px;
            font-weight: 800;
        }

        .profile-username {
            margin: 0;
            color: #8d93a8;
            font-size: 15px;
        }

        .profile-actions {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .friend-button {
            border: 0;
            border-radius: 10px;
            padding: 11px 18px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .friend-button.primary {
            background: #7c5cff;
            color: white;
        }

        .friend-button.primary:hover {
            background: #6d4ff0;
            transform: translateY(-1px);
        }

        .friend-button.secondary {
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .friend-button.secondary:hover {
            background: rgba(255, 255, 255, 0.11);
        }

        .friend-button.danger {
            background: rgba(220, 70, 70, 0.12);
            color: #ff8585;
            border: 1px solid rgba(220, 70, 70, 0.25);
        }

        .friend-button.danger:hover {
            background: rgba(220, 70, 70, 0.2);
        }

        .friend-button:disabled {
            cursor: default;
            opacity: 0.7;
        }

        .report-button {
            border: 1px solid rgba(220, 70, 70, 0.25);
            border-radius: 10px;
            padding: 11px 18px;
            background: rgba(220, 70, 70, 0.1);
            color: #ff8585;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .report-button:hover {
            background: rgba(220, 70, 70, 0.18);
            transform: translateY(-1px);
        }

        .social-grid {
            margin-top: 32px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .social-card {
            display: block;
            padding: 20px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            text-decoration: none;
            color: inherit;
            transition: 0.2s ease;
        }

        .social-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.06);
        }

        .social-title {
            font-size: 13px;
            color: #8d93a8;
            margin-bottom: 6px;
        }

        .social-value {
            font-weight: 700;
            word-break: break-word;
        }

        .status-message {
            text-align: center;
            color: #8d93a8;
            padding: 80px 20px;
        }

        .report-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(5px);
            z-index: 9999;
        }

        .report-modal {
            width: min(500px, 100%);
            padding: 26px;
            border-radius: 18px;
            background: #10131f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
        }

        .report-modal h2 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .report-modal-description {
            margin: 0 0 22px;
            color: #8d93a8;
            font-size: 13px;
            line-height: 1.6;
        }

        .report-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .report-form label {
            font-size: 13px;
            font-weight: 700;
            margin-top: 4px;
        }

        .report-form select,
        .report-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .report-form select:focus,
        .report-form textarea:focus {
            border-color: rgba(124, 92, 255, 0.5);
        }

        .report-form textarea {
            min-height: 110px;
            resize: vertical;
        }

        .report-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .report-actions button {
            flex: 1;
            min-height: 42px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .report-cancel {
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.06);
            color: white;
        }

        .report-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .report-submit {
            border: 0;
            background: #7c5cff;
            color: white;
        }

        .report-submit:hover {
            background: #6d4ff0;
        }

        .report-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .report-status {
            min-height: 18px;
            margin: 4px 0 0;
            color: #8d93a8;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .profile-page {
                padding: 24px 14px 60px;
            }

            .profile-content {
                padding: 24px 20px;
            }

            .social-grid {
                grid-template-columns: 1fr;
            }

            .report-modal {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="sidebar">

    <div class="sidebar-logo">
        <img src="images/BlockTiersicon.png" alt="BlockTiers">
        <span>BlockTiers</span>
    </div>

    <nav class="sidebar-nav">
        <a href="index.html">Home</a>
        <a href="mace.html">Mace</a>
        <a href="sword.html">Sword</a>
        <a href="crystal.html">Crystal</a>
        <a href="axe.html">Axe</a>
        <a href="uhc.html">UHC</a>
        <a href="smp.html">SMP</a>
        <a href="rules.html">Rules</a>
        <a href="staff.html">Staff</a>
        <a href="profiles.html">Profiles</a>
        <a href="support.html">Support</a>
        <a href="whats-new.html">What's New</a>

        <a
            href="https://discord.gg/fX7caP4gMb"
            target="_blank"
            rel="noopener noreferrer"
        >
            Discord
        </a>
    </nav>

    <div id="account-slot"></div>

</div>

<main class="profile-page">

    <div id="profile-container">

        <div class="status-message">
            Loading profile...
        </div>

    </div>

</main>

<div
    class="report-overlay"
    id="report-overlay"
>

    <div class="report-modal">

        <h2>
            Report Profile
        </h2>

        <p class="report-modal-description">
            Report this profile to the BlockTiers moderation team.
            Please provide an accurate reason and any useful details.
        </p>

        <form
            class="report-form"
            id="report-form"
        >

            <label for="report-reason">
                Reason
            </label>

            <select
                id="report-reason"
                required
            >

                <option value="">
                    Select a reason
                </option>

                <option value="Harassment">
                    Harassment
                </option>

                <option value="Impersonation">
                    Impersonation
                </option>

                <option value="Inappropriate Profile">
                    Inappropriate Profile
                </option>

                <option value="Spam">
                    Spam
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

            <label for="report-details">
                Details
            </label>

            <textarea
                id="report-details"
                maxlength="1000"
                placeholder="Explain what is wrong with this profile..."
            ></textarea>

            <p
                class="report-status"
                id="report-status"
            ></p>

            <div class="report-actions">

                <button
                    type="button"
                    class="report-cancel"
                    onclick="closeReportModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="report-submit"
                    id="report-submit"
                >
                    Submit Report
                </button>

            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    window.BLOCKTIERS_SUPABASE_URL =
        "https://qzdymlzgejamwgxnlhrt.supabase.co";

    window.BLOCKTIERS_SUPABASE_ANON_KEY =
        "sb_publishable_EyMWMFT1lWh1lXlPeEDvRg_gwDUkP47";

    const supabaseClient =
        supabase.createClient(
            window.BLOCKTIERS_SUPABASE_URL,
            window.BLOCKTIERS_SUPABASE_ANON_KEY
        );

    const profileContainer =
        document.getElementById("profile-container");

    let reportedProfileId = null;

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

    function escapeAttribute(value) {
        return escapeHtml(value);
    }

    function getUsernameFromUrl() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        return params.get("username");

    }

    async function loadProfile() {

        const username =
            getUsernameFromUrl();

        if (!username) {

            profileContainer.innerHTML = `
                <div class="status-message">
                    Profile not found.
                </div>
            `;

            return;

        }

        const {
            data: profile,
            error: profileError
        } = await supabaseClient
            .from("profiles")
            .select(
                "id, username, display_name, discord_username, youtube_url"
            )
            .eq("username", username)
            .maybeSingle();

        if (profileError || !profile) {

            profileContainer.innerHTML = `
                <div class="status-message">
                    Profile not found.
                </div>
            `;

            return;

        }

        document.title =
            `${profile.display_name || profile.username} - BlockTiers`;

        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();

        const currentUser = user;

        const isOwnProfile =
            currentUser &&
            currentUser.id === profile.id;

        let actionArea = "";

        if (currentUser && !isOwnProfile) {

            actionArea = `

                <div class="profile-actions">

                    <div
                        id="friend-area"
                        style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;"
                    >
                        <button
                            class="friend-button primary"
                            disabled
                        >
                            Loading...
                        </button>
                    </div>

                    <button
                        class="report-button"
                        onclick="openReportModal('${profile.id}')"
                    >
                        Report Profile
                    </button>

                </div>

            `;

        }

        const discordCard =
            profile.discord_username
                ? `
                    <div class="social-card">

                        <div class="social-title">
                            Discord
                        </div>

                        <div class="social-value">
                            ${escapeHtml(
                                profile.discord_username
                            )}
                        </div>

                    </div>
                `
                : `
                    <div class="social-card">

                        <div class="social-title">
                            Discord
                        </div>

                        <div class="social-value">
                            Not connected
                        </div>

                    </div>
                `;

        const youtubeCard =
            profile.youtube_url
                ? `
                    <a
                        class="social-card"
                        href="${escapeAttribute(
                            profile.youtube_url
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <div class="social-title">
                            YouTube
                        </div>

                        <div class="social-value">
                            View Channel
                        </div>

                    </a>
                `
                : `
                    <div class="social-card">

                        <div class="social-title">
                            YouTube
                        </div>

                        <div class="social-value">
                            Not connected
                        </div>

                    </div>
                `;

        profileContainer.innerHTML = `

            <div class="profile-card">

                <div class="profile-banner"></div>

                <div class="profile-content">

                    <h1 class="profile-name">
                        ${escapeHtml(
                            profile.display_name ||
                            profile.username
                        )}
                    </h1>

                    <p class="profile-username">
                        @${escapeHtml(
                            profile.username
                        )}
                    </p>

                    ${actionArea}

                    <div class="social-grid">

                        ${discordCard}

                        ${youtubeCard}

                    </div>

                </div>

            </div>

        `;

        if (currentUser && !isOwnProfile) {

            await loadFriendStatus(
                currentUser.id,
                profile.id
            );

        }

    }

    async function loadFriendStatus(
        currentUserId,
        profileUserId
    ) {

        const friendArea =
            document.getElementById(
                "friend-area"
            );

        if (!friendArea) {
            return;
        }

        const { data: outgoing } =
            await supabaseClient
                .from("friend_requests")
                .select("id, status")
                .eq(
                    "sender_id",
                    currentUserId
                )
                .eq(
                    "receiver_id",
                    profileUserId
                )
                .eq(
                    "status",
                    "pending"
                )
                .maybeSingle();

        const { data: incoming } =
            await supabaseClient
                .from("friend_requests")
                .select("id, status")
                .eq(
                    "sender_id",
                    profileUserId
                )
                .eq(
                    "receiver_id",
                    currentUserId
                )
                .eq(
                    "status",
                    "pending"
                )
                .maybeSingle();

        const { data: friendship } =
            await supabaseClient
                .from("friendships")
                .select("id")
                .or(
                    `and(user_id.eq.${currentUserId},friend_id.eq.${profileUserId}),and(user_id.eq.${profileUserId},friend_id.eq.${currentUserId})`
                )
                .limit(1)
                .maybeSingle();

        if (friendship) {

            friendArea.innerHTML = `

                <button
                    class="friend-button danger"
                    onclick="unfriendUser('${profileUserId}')"
                >
                    Unfriend
                </button>

            `;

            return;
        }

        if (incoming) {

            friendArea.innerHTML = `

                <button
                    class="friend-button primary"
                    onclick="acceptFriendRequest(
                        '${incoming.id}',
                        '${profileUserId}'
                    )"
                >
                    Accept
                </button>

                <button
                    class="friend-button secondary"
                    onclick="declineFriendRequest(
                        '${incoming.id}',
                        '${profileUserId}'
                    )"
                >
                    Decline
                </button>

            `;

            return;
        }

        if (outgoing) {

            friendArea.innerHTML = `

                <button
                    class="friend-button secondary"
                    onclick="cancelFriendRequest(
                        '${outgoing.id}',
                        '${profileUserId}'
                    )"
                >
                    Request Sent
                </button>

            `;

            return;
        }

        friendArea.innerHTML = `

            <button
                class="friend-button primary"
                onclick="sendFriendRequest(
                    '${profileUserId}'
                )"
            >
                Add Friend
            </button>

        `;

    }

    async function sendFriendRequest(
        profileUserId
    ) {

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();

        if (!user) {

            alert(
                "You need to be logged in to send a friend request."
            );

            return;

        }

        const { error } =
            await supabaseClient
                .from("friend_requests")
                .insert({
                    sender_id: user.id,
                    receiver_id: profileUserId,
                    status: "pending"
                });

        if (error) {

            alert(error.message);

            return;

        }

        await loadFriendStatus(
            user.id,
            profileUserId
        );

    }

    async function cancelFriendRequest(
        requestId,
        profileUserId
    ) {

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();

        if (!user) {
            return;
        }

        const { error } =
            await supabaseClient
                .from("friend_requests")
                .delete()
                .eq("id", requestId);

        if (error) {

            alert(error.message);

            return;

        }

        await loadFriendStatus(
            user.id,
            profileUserId
        );

    }

    async function declineFriendRequest(
        requestId,
        profileUserId
    ) {

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();

        if (!user) {
            return;
        }

        const { error } =
            await supabaseClient
                .from("friend_requests")
                .update({
                    status: "declined"
                })
                .eq(
                    "id",
                    requestId
                )
                .eq(
                    "receiver_id",
                    user.id
                );

        if (error) {

            alert(error.message);

            return;

        }

        await loadFriendStatus(
            user.id,
            profileUserId
        );

    }

    async function acceptFriendRequest(
        requestId,
        profileUserId
    ) {

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();

        if (!user) {
            return;
        }

        const {
            error: requestError
        } =
            await supabaseClient
                .from("friend_requests")
                .update({
                    status: "accepted"
                })
                .eq(
                    "id",
                    requestId
                )
                .eq(
                    "receiver_id",
                    user.id
                );

        if (requestError) {

            alert(requestError.message);

            return;

        }

        const firstUser =
            user.id < profileUserId
                ? user.id
                : profileUserId;

        const secondUser =
            user.id < profileUserId
                ? profileUserId
                : user.id;

        const {
            error: friendshipError
        } =
            await supabaseClient
                .from("friendships")
                .insert([
                    {
                        user_id: firstUser,
                        friend_id: secondUser
                    },
                    {
                        user_id: secondUser,
                        friend_id: firstUser
                    }
                ]);

        if (friendshipError) {

            alert(
                friendshipError.message
            );

            return;

        }

        await loadFriendStatus(
            user.id,
            profileUserId
        );

    }

    async function unfriendUser(
        profileUserId
    ) {

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();

        if (!user) {
            return;
        }

        const confirmed =
            confirm(
                "Are you sure you want to remove this friend?"
            );

        if (!confirmed) {
            return;
        }

        const { error } =
            await supabaseClient
                .from("friendships")
                .delete()
                .or(
                    `and(user_id.eq.${user.id},friend_id.eq.${profileUserId}),and(user_id.eq.${profileUserId},friend_id.eq.${user.id})`
                );

        if (error) {

            alert(error.message);

            return;

        }

        await loadFriendStatus(
            user.id,
            profileUserId
        );

    }

    function openReportModal(profileId) {

        reportedProfileId = profileId;

        const overlay =
            document.getElementById(
                "report-overlay"
            );

        const form =
            document.getElementById(
                "report-form"
            );

        const status =
            document.getElementById(
                "report-status"
            );

        form.reset();

        status.textContent = "";

        overlay.style.display = "flex";

    }

    function closeReportModal() {

        const overlay =
            document.getElementById(
                "report-overlay"
            );

        overlay.style.display = "none";

        reportedProfileId = null;

    }

    async function submitReport(event) {

        event.preventDefault();

        const status =
            document.getElementById(
                "report-status"
            );

        const button =
            document.getElementById(
                "report-submit"
            );

        const reason =
            document.getElementById(
                "report-reason"
            ).value;

        const details =
            document.getElementById(
                "report-details"
            ).value.trim();

        if (!reason) {

            status.textContent =
                "Please select a reason.";

            return;

        }

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();

        if (!user) {

            status.textContent =
                "You need to be logged in to report a profile.";

            return;

        }

        if (!reportedProfileId) {
            return;
        }

        if (user.id === reportedProfileId) {

            status.textContent =
                "You cannot report your own profile.";

            return;

        }

        button.disabled = true;
        button.textContent = "Submitting...";

        const {
            error
        } =
            await supabaseClient
                .from("profile_reports")
                .insert({
                    reported_profile_id:
                        reportedProfileId,

                    reporter_id:
                        user.id,

                    reason:
                        reason,

                    details:
                        details || null,

                    status:
                        "pending"
                });

        if (error) {

            console.error(
                "BlockTiers report error:",
                error
            );

            if (error.code === "23505") {

                status.textContent =
                    "You already have a pending report for this profile.";

            } else {

                status.textContent =
                    "Failed to submit report.";

            }

            button.disabled = false;
            button.textContent =
                "Submit Report";

            return;

        }

        status.textContent =
            "Report submitted successfully.";

        button.textContent =
            "Submitted";

        setTimeout(() => {

            closeReportModal();

            button.disabled = false;

            button.textContent =
                "Submit Report";

        }, 1200);

    }

    document
        .getElementById("report-form")
        .addEventListener(
            "submit",
            submitReport
        );

    document
        .getElementById("report-overlay")
        .addEventListener(
            "click",
            function(event) {

                if (event.target === this) {
                    closeReportModal();
                }

            }
        );

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape" &&
                reportedProfileId
            ) {
                closeReportModal();
            }

        }
    );

    loadProfile();

</script>

</body>
</html>
