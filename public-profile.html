
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - BlockTiers</title>

    <link rel="icon" type="image/png" href="images/BlockTiersicon.png">
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        .profile-page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .profile-card {
            background: rgba(15, 18, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
        }

        .profile-banner {
            height: 180px;
            background: linear-gradient(135deg, #171b2d, #0b0d16);
        }

        .profile-content {
            padding: 32px;
            text-align: center;
        }

        .profile-name {
            margin: 0 0 4px;
            font-size: 30px;
            font-weight: 800;
        }

        .profile-username {
            margin: 0;
            color: #8d93a8;
            font-size: 15px;
        }

        .profile-actions {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .friend-button {
            border: 0;
            border-radius: 10px;
            padding: 11px 18px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .friend-button.primary {
            background: #7c5cff;
            color: white;
        }

        .friend-button.primary:hover {
            background: #6d4ff0;
            transform: translateY(-1px);
        }

        .friend-button.secondary {
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .friend-button.secondary:hover {
            background: rgba(255, 255, 255, 0.11);
        }

        .friend-button.danger {
            background: rgba(220, 70, 70, 0.12);
            color: #ff8585;
            border: 1px solid rgba(220, 70, 70, 0.25);
        }

        .friend-button.danger:hover {
            background: rgba(220, 70, 70, 0.2);
        }

        .friend-button:disabled {
            cursor: default;
            opacity: 0.7;
        }

        .social-grid {
            margin-top: 32px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .social-card {
            display: block;
            padding: 20px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            text-decoration: none;
            color: inherit;
            transition: 0.2s ease;
        }

        .social-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.06);
        }

        .social-title {
            font-size: 13px;
            color: #8d93a8;
            margin-bottom: 6px;
        }

        .social-value {
            font-weight: 700;
            word-break: break-word;
        }

        .status-message {
            text-align: center;
            color: #8d93a8;
            padding: 80px 20px;
        }

        @media (max-width: 700px) {
            .profile-page {
                padding: 24px 14px 60px;
            }

            .profile-content {
                padding: 24px 20px;
            }

            .social-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="sidebar">
    <div class="sidebar-logo">
        <img src="images/BlockTiersicon.png" alt="BlockTiers">
        <span>BlockTiers</span>
    </div>

    <nav class="sidebar-nav">
        <a href="index.html">Home</a>
        <a href="mace.html">Mace</a>
        <a href="sword.html">Sword</a>
        <a href="crystal.html">Crystal</a>
        <a href="axe.html">Axe</a>
        <a href="uhc.html">UHC</a>
        <a href="smp.html">SMP</a>
        <a href="rules.html">Rules</a>
        <a href="staff.html">Staff</a>
        <a href="profiles.html">Profiles</a>
        <a href="support.html">Support</a>
        <a href="whats-new.html">What's New</a>
        <a href="https://discord.gg/fX7caP4gMb" target="_blank">Discord</a>
    </nav>

    <div id="account-slot"></div>
</div>

<main class="profile-page">
    <div id="profile-container">
        <div class="status-message">Loading profile...</div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    window.BLOCKTIERS_SUPABASE_URL = "https://qzdymlzgejamwgxnlhrt.supabase.co";
    window.BLOCKTIERS_SUPABASE_ANON_KEY = "sb_publishable_EyMWMFT1lWh1lXlPeEDvRg_gwDUkP47";

    const supabaseClient = supabase.createClient(
        window.BLOCKTIERS_SUPABASE_URL,
        window.BLOCKTIERS_SUPABASE_ANON_KEY
    );

    const profileContainer =
        document.getElementById("profile-container");

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
        return escapeHtml(value);
    }

    function getUsernameFromUrl() {
        const params =
            new URLSearchParams(window.location.search);

        return params.get("username");
    }

    async function loadProfile() {
        const username =
            getUsernameFromUrl();

        if (!username) {
            profileContainer.innerHTML = `
                <div class="status-message">
                    Profile not found.
                </div>
            `;

            return;
        }

        const {
            data: profile,
            error: profileError
        } = await supabaseClient
            .from("profiles")
            .select(
                "id, username, display_name, discord_username, youtube_url"
            )
            .eq("username", username)
            .maybeSingle();

        if (profileError || !profile) {
            profileContainer.innerHTML = `
                <div class="status-message">
                    Profile not found.
                </div>
            `;

            return;
        }

        document.title =
            `${profile.display_name || profile.username} - BlockTiers`;

        let currentUser = null;

        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();

        currentUser = user;

        let friendArea = "";

        if (currentUser && currentUser.id !== profile.id) {
            friendArea = `
                <div id="friend-area" class="profile-actions">
                    <button class="friend-button primary" disabled>
                        Loading...
                    </button>
                </div>
            `;
        }

        const discordCard =
            profile.discord_username
                ? `
                    <div class="social-card">
                        <div class="social-title">Discord</div>
                        <div class="social-value">
                            ${escapeHtml(profile.discord_username)}
                        </div>
                    </div>
                `
                : `
                    <div class="social-card">
                        <div class="social-title">Discord</div>
                        <div class="social-value">
                            Not connected
                        </div>
                    </div>
                `;

        const youtubeCard =
            profile.youtube_url
                ? `
                    <a
                        class="social-card"
                        href="${escapeAttribute(profile.youtube_url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <div class="social-title">YouTube</div>
                        <div class="social-value">
                            View Channel
                        </div>
                    </a>
                `
                : `
                    <div class="social-card">
                        <div class="social-title">YouTube</div>
                        <div class="social-value">
                            Not connected
                        </div>
                    </div>
                `;

        profileContainer.innerHTML = `
            <div class="profile-card">
                <div class="profile-banner"></div>

                <div class="profile-content">

                    <h1 class="profile-name">
                        ${escapeHtml(
                            profile.display_name ||
                            profile.username
                        )}
                    </h1>

                    <p class="profile-username">
                        @${escapeHtml(profile.username)}
                    </p>

                    ${friendArea}

                    <div class="social-grid">
                        ${discordCard}
                        ${youtubeCard}
                    </div>

                </div>
            </div>
        `;

        if (currentUser && currentUser.id !== profile.id) {
            await loadFriendStatus(
                currentUser.id,
                profile.id
            );
        }
    }

    async function loadFriendStatus(
        currentUserId,
        profileUserId
    ) {
        const friendArea =
            document.getElementById("friend-area");

        if (!friendArea) {
            return;
        }

        const { data: outgoing } =
            await supabaseClient
                .from("friend_requests")
                .select("id, status")
                .eq("sender_id", currentUserId)
                .eq("receiver_id", profileUserId)
                .eq("status", "pending")
                .maybeSingle();

        const { data: incoming } =
            await supabaseClient
                .from("friend_requests")
                .select("id, status")
                .eq("sender_id", profileUserId)
                .eq("receiver_id", currentUserId)
                .eq("status", "pending")
                .maybeSingle();

        const { data: friendship } =
            await supabaseClient
                .from("friendships")
                .select("id")
                .or(
                    `and(user_id.eq.${currentUserId},friend_id.eq.${profileUserId}),and(user_id.eq.${profileUserId},friend_id.eq.${currentUserId})`
                )
                .limit(1)
                .maybeSingle();

        if (friendship) {
            friendArea.innerHTML = `
                <button
                    class="friend-button danger"
                    onclick="unfriendUser('${profileUserId}')"
                >
                    Unfriend
                </button>
            `;

            return;
        }

        if (incoming) {
            friendArea.innerHTML = `
                <button
                    class="friend-button primary"
                    onclick="acceptFriendRequest('${incoming.id}', '${profileUserId}')"
                >
                    Accept
                </button>

                <button
                    class="friend-button secondary"
                    onclick="declineFriendRequest('${incoming.id}', '${profileUserId}')"
                >
                    Decline
                </button>
            `;

            return;
        }

        if (outgoing) {
            friendArea.innerHTML = `
                <button
                    class="friend-button secondary"
                    onclick="cancelFriendRequest('${outgoing.id}', '${profileUserId}')"
                >
                    Request Sent
                </button>
            `;

            return;
        }

        friendArea.innerHTML = `
            <button
                class="friend-button primary"
                onclick="sendFriendRequest('${profileUserId}')"
            >
                Add Friend
            </button>
        `;
    }

    async function sendFriendRequest(profileUserId) {
        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();

        if (!user) {
            alert(
                "You need to be logged in to send a friend request."
            );

            return;
        }

        const { error } =
            await supabaseClient
                .from("friend_requests")
                .insert({
                    sender_id: user.id,
                    receiver_id: profileUserId,
                    status: "pending"
                });

        if (error) {
            alert(error.message);
            return;
        }

        await loadFriendStatus(
            user.id,
            profileUserId
        );
    }

    async function cancelFriendRequest(
        requestId,
        profileUserId
    ) {
        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();

        if (!user) {
            return;
        }

        const { error } =
            await supabaseClient
                .from("friend_requests")
                .delete()
                .eq("id", requestId);

        if (error) {
            alert(error.message);
            return;
        }

        await loadFriendStatus(
            user.id,
            profileUserId
        );
    }

    async function declineFriendRequest(
        requestId,
        profileUserId
    ) {
        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();

        if (!user) {
            return;
        }

        const { error } =
            await supabaseClient
                .from("friend_requests")
                .update({
                    status: "declined"
                })
                .eq("id", requestId)
                .eq("receiver_id", user.id);

        if (error) {
            alert(error.message);
            return;
        }

        await loadFriendStatus(
            user.id,
            profileUserId
        );
    }

    async function acceptFriendRequest(
        requestId,
        profileUserId
    ) {
        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();

        if (!user) {
            return;
        }

        const {
            error: requestError
        } = await supabaseClient
            .from("friend_requests")
            .update({
                status: "accepted"
            })
            .eq("id", requestId)
            .eq("receiver_id", user.id);

        if (requestError) {
            alert(requestError.message);
            return;
        }

        const firstUser =
            user.id < profileUserId
                ? user.id
                : profileUserId;

        const secondUser =
            user.id < profileUserId
                ? profileUserId
                : user.id;

        const {
            error: friendshipError
        } = await supabaseClient
            .from("friendships")
            .insert([
                {
                    user_id: firstUser,
                    friend_id: secondUser
                },
                {
                    user_id: secondUser,
                    friend_id: firstUser
                }
            ]);

        if (friendshipError) {
            alert(friendshipError.message);
            return;
        }

        await loadFriendStatus(
            user.id,
            profileUserId
        );
    }

    async function unfriendUser(profileUserId) {
        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();

        if (!user) {
            return;
        }

        const confirmed =
            confirm(
                "Are you sure you want to remove this friend?"
            );

        if (!confirmed) {
            return;
        }

        const { error } =
            await supabaseClient
                .from("friendships")
                .delete()
                .or(
                    `and(user_id.eq.${user.id},friend_id.eq.${profileUserId}),and(user_id.eq.${profileUserId},friend_id.eq.${user.id})`
                );

        if (error) {
            alert(error.message);
            return;
        }

        await loadFriendStatus(
            user.id,
            profileUserId
        );
    }

    loadProfile();
</script>

</body>
</html>
