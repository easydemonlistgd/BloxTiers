<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - BlockTiers</title>

    <link rel="icon" type="image/png" href="images/BlockTiersicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

    <style>
        .reset-page {
            max-width: 520px;
            margin: 0 auto;
            padding: 70px 20px 100px;
        }

        .reset-card {
            padding: 30px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
        }

        .reset-card h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .reset-card p {
            line-height: 1.6;
            opacity: 0.65;
        }

        .reset-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        .reset-form label {
            font-size: 14px;
            font-weight: 600;
        }

        .reset-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.25);
            color: #fff;
            outline: none;
            font-family: inherit;
        }

        .reset-form input:focus {
            border-color: rgba(255,255,255,0.3);
        }

        .reset-form button {
            padding: 11px 16px;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 9px;
            background: rgba(255,255,255,0.08);
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        .reset-form button:hover {
            background: rgba(255,255,255,0.12);
        }

        .reset-message {
            min-height: 20px;
            margin-top: 14px;
            font-size: 13px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<header class="navbar">
    <div style="display:flex;align-items:center;gap:12px;">
        <a href="index.html" class="logo">
            <img
                src="images/BlockTiersicon.png"
                alt="BlockTiers"
                style="width:34px;height:34px;object-fit:contain;border-radius:8px;"
            >
            Block<span>Tiers</span>
        </a>
    </div>
</header>

<main class="reset-page">

    <section class="reset-card">

        <div id="loading-state">
            Checking reset link...
        </div>

        <div id="reset-state" class="hidden">

            <h1>Set a new password</h1>

            <p>
                Choose a new password for your BlockTiers account.
            </p>

            <form id="reset-form" class="reset-form">

                <label for="new-password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new-password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" id="reset-button">
                    Update Password
                </button>

            </form>

            <p id="reset-message" class="reset-message"></p>

        </div>

        <div id="error-state" class="hidden">
            <h1>Reset link unavailable</h1>
            <p id="error-message">
                This reset link is invalid or has expired.
            </p>
            <p>
                <a href="forgot-password.html">Request a new reset link</a>
            </p>
        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>

<script>
    const client = window.supabase.createClient(
        window.BLOCKTIERS_SUPABASE_URL,
        window.BLOCKTIERS_SUPABASE_ANON_KEY
    );

    const loadingState =
        document.getElementById("loading-state");

    const resetState =
        document.getElementById("reset-state");

    const errorState =
        document.getElementById("error-state");

    async function prepareResetSession() {
        try {
            const params =
                new URLSearchParams(
                    window.location.search
                );

            const code =
                params.get("code");

            if (code) {
                const {
                    error
                } =
                    await client.auth.exchangeCodeForSession(
                        code
                    );

                if (error) {
                    throw error;
                }
            }

            const {
                data: {
                    session
                }
            } =
                await client.auth.getSession();

            if (!session) {
                throw new Error(
                    "No recovery session was found."
                );
            }

            loadingState.classList.add("hidden");
            resetState.classList.remove("hidden");

        } catch (error) {
            console.error(
                "BlockTiers password reset session failed:",
                error
            );

            loadingState.classList.add("hidden");
            errorState.classList.remove("hidden");
        }
    }

    document
        .getElementById("reset-form")
        .addEventListener(
            "submit",
            async function(event) {
                event.preventDefault();

                const password =
                    document.getElementById(
                        "new-password"
                    ).value;

                const confirmPassword =
                    document.getElementById(
                        "confirm-password"
                    ).value;

                const button =
                    document.getElementById(
                        "reset-button"
                    );

                const message =
                    document.getElementById(
                        "reset-message"
                    );

                if (password.length < 8) {
                    message.textContent =
                        "Password must be at least 8 characters.";
                    return;
                }

                if (password !== confirmPassword) {
                    message.textContent =
                        "Passwords do not match.";
                    return;
                }

                button.disabled = true;
                button.textContent = "Updating...";
                message.textContent = "";

                const {
                    error
                } =
                    await client.auth.updateUser({
                        password
                    });

                if (error) {
                    console.error(error);
                    message.textContent =
                        "Could not update your password. The reset link may have expired.";
                    button.disabled = false;
                    button.textContent = "Update Password";
                    return;
                }

                await client.auth.signOut();

                message.textContent =
                    "Password updated. Redirecting to login...";

                setTimeout(() => {
                    window.location.href =
                        "login.html";
                }, 1200);
            }
        );

    prepareResetSession();
</script>

</body>
</html>
