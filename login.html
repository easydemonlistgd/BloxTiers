<main class="auth-page">
<section class="auth-card">
<h1>Welcome back</h1><p class="auth-subtitle">Log in to your BlockTiers account.</p>
<form id="login-form">
<div class="form-group"><label for="login-username">Username</label><input id="login-username" type="text" placeholder="RedaPlays" autocomplete="username" required></div>
<div class="form-group"><label for="login-password">Password</label><input id="login-password" type="password" placeholder="Your password" autocomplete="current-password" required></div>
<p id="login-message" class="form-message"></p>
<button class="auth-submit" type="submit">Login</button>
</form>
<p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>
</section>
</main>
